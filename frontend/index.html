<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PF Mitra Chatbot</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1><b>PF Mitra Chatbot</b></h1>
        <marquee behavior="scroll" direction="right"><p class="subtitle">Welcome to the DLW PF Mitra ChatBot application!-DLW / BLW PF Information Assistant</p></marquee>

        <div class="chat-box" id="chatBox">

            <div class="bot-message">
                Hello Amarjeet! 👋
                <br>
                Ask your PF related question.
            </div>

        </div>

        <div class="input-area">

            <input
                type="text"
                id="userInput"
                placeholder="Type your question here..."
            >

            <button id="askBtn">
                Ask
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
